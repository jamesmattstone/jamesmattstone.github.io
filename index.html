<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Personal Projects</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #616e7c;
      --border: #e1e5ea;
      --accent: #3e4c59;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14181d;
        --card: #1c2128;
        --text: #e6e9ed;
        --muted: #9aa5b1;
        --border: #2b323b;
        --accent: #c5ccd3;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
    }

    main {
      width: 100%;
      max-width: 560px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 40px 36px;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 1.6rem;
      font-weight: 600;
      color: var(--accent);
    }

    .subtitle {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 24px 0;
    }

    p { margin: 0 0 16px; }

    footer {
      margin-top: 24px;
      color: var(--muted);
      font-size: 0.85rem;
    }

    @media (max-width: 480px) {
      main { padding: 28px 22px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Personal Projects</h1>
    <p class="subtitle">Private, non-commercial work</p>
    <hr>
    <p>
      This GitHub account and its private repositories are solely for personal use.
    </p>
  </main>
</body>
</html>
